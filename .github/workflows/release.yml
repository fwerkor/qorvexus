name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Release title; defaults to the tag name'
        required: false
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    name: Build Portable Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-13
          - target: darwin-arm64
            runner: macos-14
          - target: windows-amd64
            runner: windows-2022
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Build portable bundle
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          PLAYWRIGHT_VERSION: '1.48.2'
        run: |
          chmod +x scripts/release/build_portable_bundle.sh
          scripts/release/build_portable_bundle.sh

      - name: Build portable bundle
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          PLAYWRIGHT_VERSION: '1.48.2'
        shell: pwsh
        run: scripts/release/build_portable_bundle.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qorvexus-${{ matrix.target }}
          path: release/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find release-artifacts -maxdepth 3 -type f -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt

      - name: Resolve release metadata
        id: meta
        run: |
          tag_name="${GITHUB_REF_NAME}"
          release_name="${GITHUB_REF_NAME}"
          draft="false"
          prerelease="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
            release_name="${{ inputs.release_name }}"
            draft="${{ inputs.draft }}"
            prerelease="${{ inputs.prerelease }}"

            if [ -z "${release_name}" ]; then
              release_name="${tag_name}"
            fi
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release/*

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker tags
        id: docker_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "DOCKERHUB_USERNAME secret is required"
            exit 1
          fi

          image="${DOCKERHUB_USERNAME}/qorvexus"
          tag_name="${REF_NAME}"
          prerelease="false"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${INPUT_TAG_NAME}"
            prerelease="${INPUT_PRERELEASE}"
          fi

          version="${tag_name#v}"
          if [[ "${version}" == *-* ]]; then
            prerelease="true"
          fi
          tags="${image}:${tag_name},${image}:${version}"
          if [ "${prerelease}" != "true" ]; then
            tags="${tags},${image}:latest"
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            PLAYWRIGHT_VERSION=1.48.2
