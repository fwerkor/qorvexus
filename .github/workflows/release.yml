name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Release title; defaults to the tag name'
        required: false
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p "dist/qorvexus-${{ matrix.target }}"
          bin="qorvexus${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "dist/qorvexus-${{ matrix.target }}/${bin}" ./cmd/qorvexus
          cp README.md LICENSE "dist/qorvexus-${{ matrix.target }}/"

      - name: Package artifact
        run: |
          mkdir -p release
          base="qorvexus-${{ matrix.target }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd dist && zip -r "../release/${base}.zip" "${base}"
          else
            tar -C dist -czf "release/${base}.tar.gz" "${base}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qorvexus-${{ matrix.target }}
          path: release/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find release-artifacts -maxdepth 3 -type f -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt

      - name: Resolve release metadata
        id: meta
        run: |
          tag_name="${GITHUB_REF_NAME}"
          release_name="${GITHUB_REF_NAME}"
          draft="false"
          prerelease="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
            release_name="${{ inputs.release_name }}"
            draft="${{ inputs.draft }}"
            prerelease="${{ inputs.prerelease }}"

            if [ -z "${release_name}" ]; then
              release_name="${tag_name}"
            fi
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
